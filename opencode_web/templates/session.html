<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session - OpenCode Web</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e1e1e; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 200px; background-color: #181818; border-right: 1px solid #333; padding: 10px; }
        .editor { flex: 1; background-color: #1e1e1e; padding: 20px; font-family: monospace; font-size: 14px; overflow: auto; }
        .terminal { height: 200px; background-color: #000; border-top: 1px solid #333; padding: 10px; font-family: monospace; color: #0f0; overflow: auto; }
        button { background-color: #333; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div>
            <button onclick="location.href='/'">Dashboard</button>
            <span id="session-name" style="margin-left: 20px; font-weight: bold;"></span>
        </div>
        <div>
            <button>Save</button>
            <button style="background-color: #137fec;">Run</button>
        </div>
    </header>
    <div class="main">
        <div class="sidebar">
            <h3>Files</h3>
            <div id="file-list">
                <div>main.py</div>
                <div>README.md</div>
            </div>
        </div>
        <div class="editor" contenteditable="true">
# Welcome to your OpenCode session
print("Hello, OpenCode Web!")
        </div>
    </div>
    <div class="terminal">
        $ opencode web<br>
        Starting web server...<br>
        $
    </div>
    <script>
        const sessionId = window.location.pathname.split('/').pop();
        fetch('/api/sessions/' + sessionId).then(r => r.json()).then(data => {
            document.getElementById('session-name').innerText = data.name;
        });
    </script>
</body>
</html>
